<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>YouFly — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #030712;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .container { text-align: center; max-width: 28rem; }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; opacity: 0.5; }
    .brand { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #0ea5e9; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.75rem; }
    p { color: #6b7280; margin-bottom: 2rem; line-height: 1.6; font-size: 0.875rem; }
    button {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 2rem; background: #0284c7; color: white;
      border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }
    button:hover { background: #0ea5e9; box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4); }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">YouFly</div>
    <div class="icon" aria-hidden="true">✈️</div>
    <h1>Nu ești conectat la internet</h1>
    <p>Verifică conexiunea și încearcă din nou. YouFly are nevoie de internet pentru a căuta zboruri și prețuri în timp real.</p>
    <button onclick="location.reload()">&#x21bb; Încearcă din nou</button>
  </div>
</body>
</html>
