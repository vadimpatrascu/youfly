name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end tests (mock Duffel)
        env:
          NUXT_DUFFEL_API_TOKEN: duffel_test_ci
          NUXT_DUFFEL_API_BASE: http://127.0.0.1:4545
          NUXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          PORT: "3100"
        run: |
          node tests/mock-duffel.cjs &
          node .output/server/index.mjs &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/api/health > /dev/null && break
            sleep 1
          done
          node tests/e2e-booking.cjs
